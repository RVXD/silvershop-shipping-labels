---
Name: silvershop-shipping-labels
After:
  - silvershop-config
---
SilverShop\Model\Order:
  extensions:
    - SilverShop\ShippingLabels\Extension\OrderLabelExtension

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - SilverShop\ShippingLabels\Extension\ShippingLabelConfigExtension

SilverShop\ShippingLabels\Provider\ProviderRegistry:
  providers:
    manual: 'SilverShop\ShippingLabels\Provider\ManualProvider'

---
Name: silvershop-shipping-labels-routes
After: '#rootroutes'
---
SilverStripe\Control\Director:
  rules:
    'shippinglabels': 'SilverShop\ShippingLabels\Control\ShippingLabelController'
